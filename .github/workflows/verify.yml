name: Course verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-tokenizer.txt
      - run: python scripts/verify_course.py --output evidence/ci-${{ github.run_id }}
      - run: python scripts/compare_short_f1.py --output evidence/experiment-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: |
            evidence/ci-${{ github.run_id }}
            evidence/experiment-${{ github.run_id }}
